name: Publish site

on:
  push:
    branches: [master]
  workflow_dispatch:
  repository_dispatch:
    types: [cv-published]

permissions:
  contents: write

concurrency:
  group: publish-site
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # R from Ubuntu's own repository: no dependency on the R-hub version resolver that
      # r-lib/actions/setup-r needs (it failed twice on 2026-09-23). Packages go to a user
      # library because the system site-library is not writable by the runner user.
      - name: Set up R
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq r-base r-base-dev libcurl4-openssl-dev libssl-dev libxml2-dev
          mkdir -p "$HOME/R/library"
          echo "R_LIBS_USER=$HOME/R/library" >> "$GITHUB_ENV"
          R --version | head -n 1

      # Dependencies come as Linux binaries from Posit Package Manager (the user agent makes it
      # serve binaries; compiling fs and friends from source failed); babelquarto itself is not on
      # CRAN and is installed from GitHub (rOpenSci).
      - name: Install babelquarto
        env:
          GITHUB_PAT: ${{ github.token }}
        run: |
          Rscript -e 'options(HTTPUserAgent = sprintf("R/%s R (%s)", getRversion(), paste(getRversion(), R.version["platform"], R.version["arch"], R.version["os"])), repos = c(CRAN = "https://packagemanager.posit.co/cran/__linux__/noble/latest")); install.packages("remotes", lib = Sys.getenv("R_LIBS_USER")); remotes::install_github("ropensci/babelquarto", lib = Sys.getenv("R_LIBS_USER"), upgrade = "never")'
          Rscript -e 'stopifnot(requireNamespace("babelquarto", quietly = TRUE)); message("babelquarto ", packageVersion("babelquarto"))'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render all languages
        run: Rscript -e 'babelquarto::render_website()'

      - name: Add hreflang links and language tags
        run: python tools/post_build.py _site

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
          clean: true
          single-commit: true
