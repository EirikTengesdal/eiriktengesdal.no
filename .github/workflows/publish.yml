name: Publish site

on:
  push:
    branches: [master]
  workflow_dispatch:
  repository_dispatch:
    types: [cv-published]

permissions:
  contents: write

concurrency:
  group: publish-site
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # R from Ubuntu's own repository: no dependency on the R-hub version resolver that
      # r-lib/actions/setup-r needs (it failed twice on 2026-09-23). Packages go to a user
      # library because the system site-library is not writable by the runner user.
      # libuv1-dev lets the fs package compile should a binary ever be unavailable.
      - name: Set up R
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq r-base r-base-dev libcurl4-openssl-dev libssl-dev libxml2-dev libuv1-dev
          mkdir -p "$HOME/R/library"
          echo "R_LIBS_USER=$HOME/R/library" >> "$GITHUB_ENV"
          R --version | head -n 1

      # Dependencies come as Linux binaries from Posit Package Manager (the user agent makes it
      # serve binaries). babelquarto itself is not on CRAN: its dependencies are read from the
      # rOpenSci R-universe index, installed from Posit, and then the pure-R package is installed
      # from the R-universe without touching the GitHub API.
      - name: Install babelquarto
        run: |
          Rscript -e '
            options(HTTPUserAgent = sprintf("R/%s R (%s)", getRversion(), paste(getRversion(), R.version["platform"], R.version["arch"], R.version["os"])),
                    repos = c(CRAN = "https://packagemanager.posit.co/cran/__linux__/noble/latest"))
            lib <- Sys.getenv("R_LIBS_USER")
            ru <- "https://ropensci.r-universe.dev"
            ap <- available.packages(repos = ru)
            deps <- setdiff(tools::package_dependencies("babelquarto", db = ap)[[1]], rownames(installed.packages()))
            message("dependencies from Posit: ", paste(deps, collapse = ", "))
            if (length(deps)) install.packages(deps, lib = lib, Ncpus = 2)
            install.packages("babelquarto", lib = lib, repos = ru, dependencies = FALSE)
          '
          Rscript -e 'stopifnot(requireNamespace("babelquarto", quietly = TRUE)); message("babelquarto ", packageVersion("babelquarto"))'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render all languages
        run: Rscript -e 'babelquarto::render_website()'

      - name: Add hreflang links and language tags
        run: python tools/post_build.py _site

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
          clean: true
          single-commit: true
