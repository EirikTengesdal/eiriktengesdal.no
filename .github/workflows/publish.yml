name: Publish site

on:
  push:
    branches: [master]
  workflow_dispatch:
  repository_dispatch:
    types: [cv-published]

permissions:
  contents: write

concurrency:
  group: publish-site
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # R from Ubuntu's own repository: no dependency on the R-hub version resolver that
      # r-lib/actions/setup-r needs (it failed twice on 2026-09-23).
      - name: Set up R
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq r-base r-base-dev libcurl4-openssl-dev libssl-dev libxml2-dev
          R --version | head -n 1

      # babelquarto is not on CRAN: install it from the rOpenSci R-universe.
      - name: Install babelquarto
        run: |
          Rscript -e 'install.packages("babelquarto", repos = c("https://ropensci.r-universe.dev", "https://cloud.r-project.org"), Ncpus = 2)'
          Rscript -e 'stopifnot(requireNamespace("babelquarto", quietly = TRUE)); message("babelquarto ", packageVersion("babelquarto"))'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render all languages
        run: Rscript -e 'babelquarto::render_website()'

      - name: Add hreflang links and language tags
        run: python tools/post_build.py _site

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
          clean: true
          single-commit: true
