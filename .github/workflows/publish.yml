name: Publish site

on:
  push:
    branches: [master]
  workflow_dispatch:
  repository_dispatch:
    types: [cv-published]

permissions:
  contents: write

concurrency:
  group: publish-site
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # babelquarto is not on CRAN: install it from the rOpenSci R-universe (plain install.packages;
      # setup-r-dependencies ignored the extra repository and pak could not find the package).
      - name: Install babelquarto
        run: |
          Rscript -e 'install.packages("babelquarto", repos = c("https://ropensci.r-universe.dev", "https://packagemanager.posit.co/cran/__linux__/noble/latest"))'
          Rscript -e 'stopifnot(requireNamespace("babelquarto", quietly = TRUE)); message("babelquarto ", packageVersion("babelquarto"))'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render all languages
        run: Rscript -e 'babelquarto::render_website()'

      - name: Add hreflang links and language tags
        run: python tools/post_build.py _site

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
          clean: true
          single-commit: true
