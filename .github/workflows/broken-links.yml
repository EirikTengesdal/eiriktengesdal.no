name: Check links on the live site

on:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - name: Link checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose --no-progress --max-concurrency 4
            --accept 200,206,429
            https://eiriktengesdal.no/
            https://eiriktengesdal.no/sitemap.xml
          fail: true
